# Development environment. Copy .env.example to .env first (passwords are required).

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-RAG-Platform}
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-rag-platform}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-rag-platform-users}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  BCRYPT_COST_FACTOR: ${BCRYPT_COST_FACTOR:-12}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_AUTH_ATTEMPTS: ${RATE_LIMIT_AUTH_ATTEMPTS:-10}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_UPLOAD_ATTEMPTS: ${RATE_LIMIT_UPLOAD_ATTEMPTS:-20}
  STORAGE_BACKEND: local
  STORAGE_LOCAL_PATH: /data/uploads
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  MAX_STORAGE_BYTES_PER_USER: ${MAX_STORAGE_BYTES_PER_USER:-1073741824}
  PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
  PROCESSING_RETRY_BACKOFF_SECONDS: ${PROCESSING_RETRY_BACKOFF_SECONDS:-30}
  PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-120}
  PROCESSING_MAX_PAGES: ${PROCESSING_MAX_PAGES:-2000}
  PROCESSING_MAX_TEXT_CHARS: ${PROCESSING_MAX_TEXT_CHARS:-20000000}
  PROCESSING_MAX_DOCX_UNCOMPRESSED_BYTES: ${PROCESSING_MAX_DOCX_UNCOMPRESSED_BYTES:-209715200}
  PROCESSING_STALE_AFTER_SECONDS: ${PROCESSING_STALE_AFTER_SECONDS:-300}
  PROCESSING_SWEEP_INTERVAL_SECONDS: ${PROCESSING_SWEEP_INTERVAL_SECONDS:-60}
  PROCESSING_PENDING_REQUEUE_AFTER_SECONDS: ${PROCESSING_PENDING_REQUEUE_AFTER_SECONDS:-120}
  CHUNKING_MAX_CHARS: ${CHUNKING_MAX_CHARS:-1000}
  CHUNKING_OVERLAP_CHARS: ${CHUNKING_OVERLAP_CHARS:-150}
  CHUNKING_MIN_CHARS: ${CHUNKING_MIN_CHARS:-20}
  CHUNKING_MAX_CHUNKS: ${CHUNKING_MAX_CHUNKS:-50000}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-614241f622f53c4eeff9890bdc4f31cfecc418b3}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
  EMBEDDING_QUERY_PREFIX: "${EMBEDDING_QUERY_PREFIX-query: }"
  EMBEDDING_PASSAGE_PREFIX: "${EMBEDDING_PASSAGE_PREFIX-passage: }"
  EMBEDDING_MAX_SEQ_LENGTH: ${EMBEDDING_MAX_SEQ_LENGTH:-512}
  EMBEDDING_INCLUDE_HEADING: ${EMBEDDING_INCLUDE_HEADING:-false}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
  EMBEDDING_MAX_ATTEMPTS: ${EMBEDDING_MAX_ATTEMPTS:-3}
  EMBEDDING_TASK_BUDGET_SECONDS: ${EMBEDDING_TASK_BUDGET_SECONDS:-180}
  EMBEDDING_MODEL_LOAD_ALLOWANCE_SECONDS: ${EMBEDDING_MODEL_LOAD_ALLOWANCE_SECONDS:-120}
  EMBEDDING_STALE_AFTER_SECONDS: ${EMBEDDING_STALE_AFTER_SECONDS:-600}
  EMBEDDING_REQUEUE_AFTER_SECONDS: ${EMBEDDING_REQUEUE_AFTER_SECONDS:-120}
  EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-30}
  SEARCH_QUERY_TIMEOUT_SECONDS: ${SEARCH_QUERY_TIMEOUT_SECONDS:-20}
  RATE_LIMIT_SEARCH_ATTEMPTS: ${RATE_LIMIT_SEARCH_ATTEMPTS:-60}
  SEARCH_DEFAULT_TOP_K: ${SEARCH_DEFAULT_TOP_K:-10}
  SEARCH_MAX_TOP_K: ${SEARCH_MAX_TOP_K:-50}
  SEARCH_MAX_QUERY_CHARS: ${SEARCH_MAX_QUERY_CHARS:-1000}
  SEARCH_MAX_CONCURRENT_QUERIES: ${SEARCH_MAX_CONCURRENT_QUERIES:-4}
  HYBRID_DENSE_CANDIDATES: ${HYBRID_DENSE_CANDIDATES:-50}
  HYBRID_SPARSE_CANDIDATES: ${HYBRID_SPARSE_CANDIDATES:-50}
  HYBRID_RRF_K: ${HYBRID_RRF_K:-60}
  HYBRID_DENSE_WEIGHT: ${HYBRID_DENSE_WEIGHT:-1.0}
  HYBRID_SPARSE_WEIGHT: ${HYBRID_SPARSE_WEIGHT:-1.0}
  SPARSE_MAX_TERMS: ${SPARSE_MAX_TERMS:-12}
  SPARSE_STATEMENT_TIMEOUT_MS: ${SPARSE_STATEMENT_TIMEOUT_MS:-2000}
  SPARSE_REMOVE_STOPWORDS: ${SPARSE_REMOVE_STOPWORDS:-true}
  RAG_ENABLED: ${RAG_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen3.5:9b}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-400}
  LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-4096}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  LLM_MAX_CONCURRENT: ${LLM_MAX_CONCURRENT:-1}
  LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-json_schema}
  RAG_RETRIEVAL_MODE: ${RAG_RETRIEVAL_MODE:-hybrid}
  RAG_CANDIDATES: ${RAG_CANDIDATES:-10}
  RAG_MAX_SOURCES: ${RAG_MAX_SOURCES:-5}
  RAG_MAX_CHUNK_TOKENS: ${RAG_MAX_CHUNK_TOKENS:-600}
  RAG_CONTEXT_TOKEN_BUDGET: ${RAG_CONTEXT_TOKEN_BUDGET:-2400}
  RAG_QUEUE_TIMEOUT_SECONDS: ${RAG_QUEUE_TIMEOUT_SECONDS:-15}
  RATE_LIMIT_RAG_ATTEMPTS: ${RATE_LIMIT_RAG_ATTEMPTS:-10}
  RERANK_ENABLED: ${RERANK_ENABLED:-false}
  RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANK_MODEL_REVISION: ${RERANK_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
  RERANK_DEVICE: ${RERANK_DEVICE:-auto}
  RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-8}
  RERANK_CANDIDATES: ${RERANK_CANDIDATES:-10}
  RERANK_MAX_CANDIDATES: ${RERANK_MAX_CANDIDATES:-100}
  RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-512}
  RERANK_TIMEOUT_SECONDS: ${RERANK_TIMEOUT_SECONDS:-20}
  RERANK_LOAD_TIMEOUT_SECONDS: ${RERANK_LOAD_TIMEOUT_SECONDS:-120}
  RERANK_MAX_CONCURRENT: ${RERANK_MAX_CONCURRENT:-1}
  RERANK_PRELOAD: ${RERANK_PRELOAD:-true}
  RERANK_ALLOW_DOWNLOAD: "false"
  # The models live in a shared volume, never in the image. Only the embedding worker downloads.
  HF_HOME: /data/models
  EMBEDDING_ALLOW_DOWNLOAD: "false"
  WORKER_MAX_TASKS_PER_CHILD: ${WORKER_MAX_TASKS_PER_CHILD:-50}
  WORKER_MAX_MEMORY_PER_CHILD_KB: ${WORKER_MAX_MEMORY_PER_CHILD_KB:-1000000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/2

x-backend-build: &backend-build
  context: ./backend
  target: dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
      - model_cache:/data/models
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  celery_worker:
    build: *backend-build
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - celery,processing
      - --concurrency=${WORKER_CONCURRENCY:-2}
    environment: *backend-environment
    # Untrusted documents are parsed here: bound what a hostile file can consume.
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Embeddings run in their own worker: it loads the model (about 0.5 GB for the default), needs
  # more memory than the document worker and never parses uploaded files. It is also the only
  # service allowed to download the model; start-up fetches it into the shared model cache.
  embedding_worker:
    build: *backend-build
    command:
      - sh
      - -c
      - >-
        python -m app.embeddings.download ||
        echo "model download failed; the first embedding task will retry it";
        if [ "$${RERANK_ENABLED}" = "true" ]; then
        python -m app.reranking.download ||
        echo "reranker download failed; reranked searches will fall back until it is fetched";
        fi;
        exec celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
        -Q embedding --concurrency=${EMBEDDING_WORKER_CONCURRENCY:-1}
    environment:
      <<: *backend-environment
      EMBEDDING_ALLOW_DOWNLOAD: "true"
      RERANK_ALLOW_DOWNLOAD: "true"
      WORKER_MAX_TASKS_PER_CHILD: ${EMBEDDING_WORKER_MAX_TASKS_PER_CHILD:-1000}
      WORKER_MAX_MEMORY_PER_CHILD_KB: ${EMBEDDING_WORKER_MAX_MEMORY_PER_CHILD_KB:-2500000}
      XDG_CACHE_HOME: /tmp/.cache
    mem_limit: ${EMBEDDING_WORKER_MEMORY_LIMIT:-3g}
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backend:/app
      - model_cache:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  celery_beat:
    build: *backend-build
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ls /tmp/celerybeat-schedule* > /dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  model_cache:
  frontend_node_modules:

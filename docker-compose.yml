# Development environment. Copy .env.example to .env first (passwords are required).

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-RAG-Platform}
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-rag-platform}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-rag-platform-users}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  BCRYPT_COST_FACTOR: ${BCRYPT_COST_FACTOR:-12}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_AUTH_ATTEMPTS: ${RATE_LIMIT_AUTH_ATTEMPTS:-10}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_UPLOAD_ATTEMPTS: ${RATE_LIMIT_UPLOAD_ATTEMPTS:-20}
  STORAGE_BACKEND: local
  STORAGE_LOCAL_PATH: /data/uploads
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  MAX_STORAGE_BYTES_PER_USER: ${MAX_STORAGE_BYTES_PER_USER:-1073741824}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/2

x-backend-build: &backend-build
  context: ./backend
  target: dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    environment:
      <<: *backend-environment
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  celery_worker:
    build: *backend-build
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  frontend_node_modules:
